name: Build and Deploy Spring Boot App

on:
  push:
    branches:
      - development

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build project with Maven
      run: mvn clean package -DskipTests

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Deploy to remote server
      run: |
        ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
          set -e

          PROJECT_DIR="/home/project/lemonpay-electricity"
          echo "Updating repository..."
          if [ -d "$PROJECT_DIR/.git" ]; then
            cd "$PROJECT_DIR"
            git fetch origin development
            git reset --hard origin/development
          else
            git clone -b development https://github.com/lemonpayltd/lemonpay-electricity.git "$PROJECT_DIR"
            cd "$PROJECT_DIR"
          fi
          echo "Restarting Docker containers..."
          # Fix Git safe directory warning
          git config --add safe.directory "$PROJECT_DIR"

          echo "Restarting Docker containers..."
          docker compose down
          docker compose up -d --build
        EOF










